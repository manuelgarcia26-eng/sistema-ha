<style>
:root{
  --bg:#0D0F14;--surface:#13161E;--card:#181C26;--border:#252A38;
  --accent:#6C63FF;--accent-soft:#6C63FF22;
  --gold:#F5A623;--gold-soft:#F5A62322;
  --green:#2DD4A0;--green-soft:#2DD4A022;
  --red:#FF6B6B;--red-soft:#FF6B6B22;
  --blue:#4FC3F7;--blue-soft:#4FC3F722;
  --purple:#C084FC;--purple-soft:#C084FC22;
  --text:#E8EAF0;--muted:#7B829A;--dim:#4A5068;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden}
@supports(padding:env(safe-area-inset-top)){
  .app{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes glow{0%,100%{box-shadow:0 0 8px #6C63FF44}50%{box-shadow:0 0 22px #6C63FF88}}
@keyframes intentionPulse{0%,100%{box-shadow:0 0 0 0 #F5A62300}50%{box-shadow:0 0 0 8px #F5A62322}}
@keyframes spin{to{transform:rotate(360deg)}}

.app{display:flex;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto}
.header{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between}
.header-title{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.5px}
.header-date{font-size:12px;color:var(--muted);margin-top:2px}
.capture-btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-family:'DM Sans';font-weight:500;animation:glow 3s infinite;cursor:pointer}
.nav{display:flex;gap:4px;padding:14px 20px 0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{background:var(--surface);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:11px;font-family:'DM Sans';font-weight:500;white-space:nowrap;cursor:pointer;transition:all .2s;flex-shrink:0;position:relative}
.nav-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav-dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--red);border:1px solid var(--bg)}
.content{flex:1;padding:16px 20px 100px;animation:fadeIn .3s ease}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:12px}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:4px;transition:width .6s ease}
.habit-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 15px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .2s;margin-bottom:8px;width:100%;text-align:left}

.intention-card{background:linear-gradient(135deg,#F5A62318,#F5A62308);border:1px solid #F5A62355;border-radius:16px;padding:18px;margin-bottom:12px}

.bar-fill{width:100%;border-radius:4px 4px 0 0;transition:height .5s ease;min-height:2px}

.heat-cell{aspect-ratio:1;border-radius:3px;transition:all .2s}

</style>

<script>
'use strict';

// ════════════════════════════════════════════════════════════════════════════
// SECURITY LAYER — XSS protection
// ════════════════════════════════════════════════════════════════════════════
function esc(str){
  if(str===null||str===undefined) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

// ════════════════════════════════════════════════════════════════════════════
// TOAST NOTIFICATIONS
// ════════════════════════════════════════════════════════════════════════════
let toastTimeout=null;
function toast(msg,type='info'){
  const existing=document.querySelector('.toast');
  if(existing) existing.remove();
  const el=document.createElement('div');
  el.className='toast '+type;
  el.textContent=msg;
  document.body.appendChild(el);
  if(toastTimeout) clearTimeout(toastTimeout);
  toastTimeout=setTimeout(()=>el.remove(),3500);
}

// ════════════════════════════════════════════════════════════════════════════
// DATABASE LAYER — IndexedDB with localStorage fallback
// ════════════════════════════════════════════════════════════════════════════
const DB_NAME='SistemaHA';
const DB_VERSION=1;
const STORES={
  meta:'meta',           // app metadata, version, config
  habits:'habits',       // habit definitions
  ideas:'ideas',         // captured ideas
  log:'log',             // daily completions { key: YYYY-MM-DD, data: {habitId: bool} }
  daily:'daily',         // daily metadata (energy, intention, evening reflection)
  reviews:'reviews',     // weekly reviews
};

let db=null;
let usingFallback=false;

async function openDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){
      console.warn('IndexedDB not supported, falling back to localStorage');
      usingFallback=true;
      resolve(null);
      return;
    }
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onerror=()=>{
      console.error('DB open error',req.error);
      usingFallback=true;
      resolve(null);
    };
    req.onsuccess=()=>{
      db=req.result;
      resolve(db);
    };
    req.onupgradeneeded=(e)=>{
      const _db=e.target.result;
      Object.values(STORES).forEach(name=>{
        if(!_db.objectStoreNames.contains(name)){
          _db.createObjectStore(name,{keyPath:'key'});
        }
      });
    };
  });
}

function dbTx(storeName,mode='readonly'){
  if(!db) return null;
  return db.transaction(storeName,mode).objectStore(storeName);
}

async function dbGet(store,key){
  if(usingFallback){
    try{
      const raw=localStorage.getItem(`fb_${store}_${key}`);
      return raw?JSON.parse(raw):null;
    }catch(e){console.error('localStorage fallback get error',e);return null}
  }
  return new Promise((resolve)=>{
    try{
      const tx=dbTx(store);
      const req=tx.get(key);
      req.onsuccess=()=>resolve(req.result?req.result.value:null);
      req.onerror=()=>{console.error('dbGet error',req.error);resolve(null)};
    }catch(e){console.error('dbGet exception',e);resolve(null)}
  });
}

async function dbSet(store,key,value){
  if(usingFallback){
    try{
      localStorage.setItem(`fb_${store}_${key}`,JSON.stringify(value));
      return true;
    }catch(e){console.error('localStorage fallback set error',e);return false}
  }
  return new Promise((resolve)=>{
    try{
      const tx=dbTx(store,'readwrite');
      const req=tx.put({key,value});
      req.onsuccess=()=>resolve(true);
      req.onerror=()=>{console.error('dbSet error',req.error);resolve(false)};
    }catch(e){console.error('dbSet exception',e);resolve(false)}
  });
}

async function dbGetAll(store){
  if(usingFallback){
    const result={};
    try{
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i);
        if(k&&k.startsWith(`fb_${store}_`)){
          const key=k.substring(`fb_${store}_`.length);
          result[key]=JSON.parse(localStorage.getItem(k));
        }
      }
    }catch(e){console.error('localStorage getAll error',e)}
    return result;
  }
  return new Promise((resolve)=>{
    try{
      const tx=dbTx(store);
      const req=tx.getAll();
      req.onsuccess=()=>{
        const result={};
        (req.result||[]).forEach(item=>{result[item.key]=item.value});
        resolve(result);
      };
      req.onerror=()=>{console.error('dbGetAll error',req.error);resolve({})};
    }catch(e){console.error('dbGetAll exception',e);resolve({})}
  });
}

async function dbDelete(store,key){
  if(usingFallback){
    try{localStorage.removeItem(`fb_${store}_${key}`);return true}catch(e){return false}
  }
  return new Promise((resolve)=>{
    try{
      const tx=dbTx(store,'readwrite');
      const req=tx.delete(key);
      req.onsuccess=()=>resolve(true);
      req.onerror=()=>resolve(false);
    }catch(e){resolve(false)}
  });
}

  const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+4-(d.getDay()||7));
  const y=new Date(d.getFullYear(),0,1);return Math.ceil((((d-y)/86400000)+1)/7);
}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return dateKey(d)}
function formatDate(){return new Date().toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'})}

async function migrateFromOldLocalStorage(){
  try{
    const oldKeys=['ha2_habits','ha2_ideas','ha2_streak','ha2_log','ha2_paused','ha_habits','ha_ideas','ha_streak','ha_log','ha_paused'];
    let migrated=false;
    for(const key of oldKeys){
      const raw=localStorage.getItem(key);
      if(!raw) continue;
      try{
        const data=JSON.parse(raw);
        if(key.includes('habits')&&Array.isArray(data)&&S.habits.length===0){S.habits=data;migrated=true}
        else if(key.includes('ideas')&&Array.isArray(data)&&S.ideas.length===0){S.ideas=data;migrated=true}
        else if(key.includes('streak')&&typeof data==='object'&&Object.keys(S.streak).length===0){S.streak=data;migrated=true}
        else if(key.includes('log')&&typeof data==='object'&&Object.keys(S.log).length===0){S.log=data;migrated=true}
        else if(key.includes('paused')&&Array.isArray(data)&&S.pausedHabits.length===0){S.pausedHabits=data;migrated=true}
      }catch(e){console.warn('Could not parse old key',key)}
    }
    if(migrated){
      await saveAll();
      toast('Datos migrados desde versión anterior','success');
    }
  }catch(e){console.error('migration error',e)}
}

// LOG HELPERS
// ════════════════════════════════════════════════════════════════════════════
function getLog(day){return S.log[day]||{}}
function setLog(day,habitId,val){
  if(!S.log[day]) S.log[day]={};
  S.log[day][habitId]=val;
}
function isDone(habitId,day){return !!(getLog(day||TODAY)[habitId])}
function getCompletedOnDay(day){
  const log=getLog(day);
  return activeHabits().filter(h=>log[h.id]).length;
}
function getPctOnDay(day){
  const a=activeHabits().length;
  return a>0?Math.round(getCompletedOnDay(day)/a*100):0;
}

// ════════════════════════════════════════════════════════════════════════════
// ANALYTICS
// ════════════════════════════════════════════════════════════════════════════
function getLast30Days(){return Array.from({length:30},(_,i)=>daysAgo(29-i))}
function getLast90Days(){return Array.from({length:90},(_,i)=>daysAgo(89-i))}

function getWeekdayStats(){
  const totals=Array(7).fill(0),counts=Array(7).fill(0);
  for(let i=0;i<60;i++){
    const d=daysAgo(i);
    if(!S.log[d]) continue;
    const pct=getPctOnDay(d);
    const dow=new Date(d+'T12:00:00').getDay();
    totals[dow]+=pct;counts[dow]++;
  }
  return totals.map((t,i)=>counts[i]>0?Math.round(t/counts[i]):null);
}
function getWeakestDay(){
  const s=getWeekdayStats();let min=101,mi=-1;
  s.forEach((v,i)=>{if(v!==null&&v<min){min=v;mi=i}});
  return mi>=0?{day:DAYS_ES[mi],pct:min}:null;
}
function getBestDay(){
  const s=getWeekdayStats();let max=-1,mi=-1;
  s.forEach((v,i)=>{if(v!==null&&v>max){max=v;mi=i}});
  return mi>=0?{day:DAYS_ES[mi],pct:max}:null;
}
function getConsistency30(){
  const days=getLast30Days();
  const active=days.filter(d=>getCompletedOnDay(d)>0).length;
  return Math.round(active/days.length*100);
}
function getBestStreak(){
  const days=getLast90Days();let best=0,cur=0;
  days.forEach(d=>{if(getCompletedOnDay(d)>0)cur++;else cur=0;if(cur>best)best=cur;});
  return best;
}
function getInsights(){
  const insights=[];
  const cons=getConsistency30(),weak=getWeakestDay(),best=getBestDay(),bestS=getBestStreak();
  const alerts=getFrictionAlerts();
  if(cons>=80) insights.push({type:'good',text:`Consistencia del ${cons}% en los últimos 30 días. Estás construyendo identidad real.`});
  else if(cons>=50) insights.push({type:'warn',text:`Consistencia del ${cons}% en 30 días. Hay espacio para mejorar.`});
  else if(cons>0) insights.push({type:'bad',text:`Consistencia del ${cons}%. El sistema necesita rediseño, no más voluntad.`});
  if(weak&&weak.pct<50) insights.push({type:'warn',text:`Los ${weak.day} son tu punto débil (${weak.pct}%). Revisa qué pasa ese día.`});
  if(best&&best.pct>80) insights.push({type:'good',text:`Los ${best.day} son tu mejor día (${best.pct}%). ¿Qué haces diferente?`});
  if(bestS>=7) insights.push({type:'good',text:`Tu mejor racha fue de ${bestS} días consecutivos.`});
  if(alerts.length>0) insights.push({type:'bad',text:`${alerts.length} hábito(s) con fricción activa.`});
  return insights;
}

function cat(id){return CATS.find(c=>c.id===id)||CATS[2]}
function activeHabits(){return S.habits.filter(h=>h.active&&!S.pausedHabits.includes(h.id))}
function completedToday(){return activeHabits().filter(h=>isDone(h.id)).length}
function progressPct(){const a=activeHabits().length;return a>0?Math.round(completedToday()/a*100):0}
function pendingIdeas(){return S.ideas.filter(i=>!i.processed).length}
function maxStreak(){return Math.max(0,...S.habits.map(h=>S.streak[h.id]||0))}
function getStreak(id){return S.streak[id]||0}
function isImported(pid){return S.habits.some(h=>h.presetId===pid)}
function reviewDone(){return Object.keys(S.weekReview).length>=4}
function getMissedDays(habitId){
  let count=0;
  for(let i=1;i<=7;i++){if(!isDone(habitId,daysAgo(i)))count++;else break}
  return count;
}
function getFrictionAlerts(){
  return S.habits.filter(h=>h.active&&h.type==='building'&&!S.pausedHabits.includes(h.id))
    .map(h=>({habit:h,missed:getMissedDays(h.id)}))
    .filter(x=>x.missed>=3).sort((a,b)=>b.missed-a.missed);
}

async function exportData(){
  try{
    const allLog=await dbGetAll(STORES.log);
    const allDaily=await dbGetAll(STORES.daily);
    const allReviews=await dbGetAll(STORES.reviews);
    const data={
      version:3,exportedAt:new Date().toISOString(),
      habits:S.habits,ideas:S.ideas,streak:S.streak,
      log:allLog,daily:allDaily,reviews:allReviews,
      pausedHabits:S.pausedHabits,
    };
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='sistema-ha-'+TODAY+'.json';
    document.body.appendChild(a);a.click();a.remove();
    URL.revokeObjectURL(url);
    toast('Backup descargado','success');
  }catch(e){console.error('export failed',e);toast('Error al exportar','error')}
}
function importData(){document.getElementById('importFile').click()}
async function handleImport(e){
  const file=e.target.files[0];if(!file)return;
  if(file.size>10*1024*1024){toast('Archivo demasiado grande','error');return}
  const reader=new FileReader();
  reader.onload=async(ev)=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data||typeof data!=='object'){throw new Error('Invalid format')}
      if(!confirm('¿Reemplazar todos los datos actuales con este backup? Esta acción no se puede deshacer.'))return;
      if(Array.isArray(data.habits))S.habits=data.habits;
      if(Array.isArray(data.ideas))S.ideas=data.ideas;
      if(typeof data.streak==='object'&&data.streak!==null)S.streak=data.streak;
      if(Array.isArray(data.pausedHabits))S.pausedHabits=data.pausedHabits;
      if(data.log&&typeof data.log==='object'){
        S.log=data.log;
        for(const [k,v] of Object.entries(data.log)) await dbSet(STORES.log,k,v);
      }
      if(data.daily&&typeof data.daily==='object'){
        for(const [k,v] of Object.entries(data.daily)) await dbSet(STORES.daily,k,v);
      }
      if(data.reviews&&typeof data.reviews==='object'){
        for(const [k,v] of Object.entries(data.reviews)) await dbSet(STORES.reviews,k,v);
      }
      await saveAll();
      // reload from db to get all state correctly
      await loadAll();
      render();
      toast('✅ Datos importados correctamente','success');
    }catch(err){
      console.error('import error',err);
      toast('Archivo inválido. Asegúrate de usar un backup de este sistema.','error');
    }
  };
  reader.readAsText(file);
}

      <button onclick="S.addingHabit=true;render()" style="background:var(--gold);color:#000;border:none;border-radius:8px;padding:5px 12px;font-size:12px;font-family:'DM Sans';font-weight:600;cursor:pointer">+ Nuevo</button>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Con la fórmula Señal → Rutina → Recompensa.</div>
    ${formHTML}
    ${bH.length===0&&!S.addingHabit?`<div style="text-align:center;padding:16px 0;color:var(--muted);font-size:13px">Toca "+ Nuevo" para crear tu primer hábito.</div>`
    :bH.map(h=>{
      const c=cat(h.category);const s=getStreak(h.id);const missed=getMissedDays(h.id);
      const cons30=Math.round(getLast30Days().filter(d=>isDone(h.id,d)).length/30*100);
      return `<div style="background:var(--card);border:1px solid ${missed>=3?'var(--red)55':'var(--border)'};border-radius:12px;padding:14px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:${(h.cue||h.routine)?'10px':'0'}">
          <div style="display:flex;gap:8px">
            <div style="width:32px;height:32px;border-radius:8px;background:${c.color}22;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">${c.icon}</div>
            <div>
              <div style="font-weight:600;font-size:14px">${esc(h.name)}</div>
              <div style="font-size:11px;color:${c.color};margin-top:2px">${esc(c.label)}${h.time?' · 🕐'+esc(h.time):''}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:2px">30d: ${cons30}% · 🔥${s}d${missed>=3?' · <span style="color:var(--red)">⚠️ '+missed+' días</span>':''}</div>
            </div>
          </div>
          <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-items:center">
            ${missed>=3?`<button onclick="openFriction(${h.id})" style="background:var(--red-soft);color:var(--red);border:none;border-radius:6px;padding:4px 7px;font-size:10px;cursor:pointer;font-weight:600">🔧</button>`:''}
            <button onclick="promoteToIdentity(${h.id})" style="background:var(--green-soft);color:var(--green);border:none;border-radius:6px;padding:4px 7px;font-size:10px;cursor:pointer;font-weight:600">✅</button>
            <button class="del-btn" onclick="removeHabit(${h.id})">×</button>
          </div>
        </div>
        ${h.cue?`<div class="formula-row"><span style="font-size:12px">🎯</span><span style="font-size:12px;color:var(--muted)">${esc(h.cue)}</span></div>`:''}
        ${h.routine?`<div class="formula-row"><span style="font-size:12px">⚡</span><span style="font-size:12px;color:var(--muted)">${esc(h.routine)}</span></div>`:''}
        ${h.reward?`<div class="formula-row"><span style="font-size:12px">🏆</span><span style="font-size:12px;color:var(--muted)">${esc(h.reward)}</span></div>`:''}
      </div>`;
    }).join('')}
  </div>`;

  return `<div class="page-title" style="margin-bottom:14px">⚛️ Mis Hábitos</div>${importSection}${buildSection}`;
}

function renderMemoria(){
  const days30=getLast30Days(),days90=getLast90Days();
  const insights=getInsights();
  const weekStats=getWeekdayStats();
  const cons=getConsistency30(),bestS=getBestStreak();

  const heatCells=days90.map(d=>{
    const pct=getPctOnDay(d);
    let bg;
    if(!S.log[d]||Object.keys(S.log[d]||{}).length===0) bg='var(--border)';
    else if(pct===0) bg='#FF6B6B22';
    else if(pct<50) bg='#F5A62344';
    else if(pct<80) bg='#2DD4A066';
    else bg='#2DD4A0';
    const date=new Date(d+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'});
    return `<div class="heat-cell" style="background:${bg}" title="${esc(date)}: ${pct}%"></div>`;
  }).join('');

  const maxPct=Math.max(...weekStats.filter(v=>v!==null),1);
  const barChart=DAYS_ES.map((day,i)=>{
    const v=weekStats[i];
    const h=v!==null?Math.max(4,Math.round((v/maxPct)*70)):4;
    const color=v===null?'var(--border)':v>=80?'var(--green)':v>=50?'var(--accent)':'var(--red)';
    return `<div class="bar-col">
      <div style="font-size:9px;color:var(--muted);font-weight:600;margin-bottom:2px">${v!==null?v+'%':''}</div>
      <div class="bar-fill" style="height:${h}px;background:${color}"></div>
      <div class="bar-label">${day}</div>
    </div>`;
  }).join('');

  const habitRows=S.habits.map(h=>{
    const s=getStreak(h.id);
    const color=h.color||cat(h.category).color;
    const pct30=days30.filter(d=>isDone(h.id,d)).length;
    const consistency=Math.round(pct30/30*100);
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="width:32px;height:32px;border-radius:8px;background:${color}22;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0">${cat(h.category).icon}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(h.name)}</div>
        <div style="display:flex;gap:8px;margin-top:4px">
          <div style="height:4px;background:var(--border);border-radius:2px;flex:1;overflow:hidden">
            <div style="height:100%;width:${consistency}%;background:${color};border-radius:2px"></div>
          </div>
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:16px;color:${color}">${consistency}%</div>
        <div style="font-size:10px;color:var(--dim)">🔥 ${s}d</div>
      </div>
    </div>`;
  }).join('');

  return `
    <div class="page-title">📊 Memoria del Sistema</div>
    <div class="page-sub">Tu historial real. Aquí vive el efecto compuesto.</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-icon">📅</div><div class="stat-val" style="color:var(--accent)">${cons}%</div><div class="stat-label">Consistencia 30 días</div></div>
      <div class="stat-card"><div class="stat-icon">🔥</div><div class="stat-val" style="color:var(--gold)">${bestS}d</div><div class="stat-label">Mejor racha</div></div>
      <div class="stat-card"><div class="stat-icon">⚛️</div><div class="stat-val" style="color:var(--green)">${S.habits.filter(h=>h.type==='identity').length}</div><div class="stat-label">Identidad</div></div>
      <div class="stat-card"><div class="stat-icon">🔨</div><div class="stat-val" style="color:var(--purple)">${S.habits.filter(h=>h.type==='building').length}</div><div class="stat-label">En construcción</div></div>
    </div>
    ${insights.length>0?`<div style="margin-bottom:12px">${insights.map(i=>`
      <div class="insight-chip ${i.type}">
        <span>${i.type==='good'?'✅':i.type==='warn'?'⚠️':'🚨'}</span>
        <span>${esc(i.text)}</span>
      </div>`).join('')}</div>`:''}
    <div class="card">
      <div class="chart-title">Últimos 90 días</div>
      <div class="heatmap">${heatCells}</div>
      <div style="display:flex;gap:12px;margin-top:8px;flex-wrap:wrap">
        ${[['var(--border)','Sin datos'],['#FF6B6B22','0%'],['#F5A62344','<50%'],['#2DD4A066','<80%'],['#2DD4A0','100%']].map(([c,l])=>`
          <div style="display:flex;align-items:center;gap:4px">
            <div style="width:10px;height:10px;border-radius:2px;background:${c}"></div>
            <span style="font-size:10px;color:var(--dim)">${esc(l)}</span>
          </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="chart-title">Promedio por día de la semana</div>
      <div class="bar-chart">${barChart}</div>
    </div>
    ${S.habits.length>0?`<div class="card">
      <div class="chart-title">Consistencia por hábito — 30 días</div>
      ${habitRows}
    </div>`:''}
    <div class="card">
      <div class="chart-title">Backup y restauración</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.6">
        Exporta tu historial para hacer backup. Importa para restaurarlo en otro celular.
      </div>
      <button class="export-btn" onclick="exportData()">
        <span style="font-size:18px">📤</span>
        <div style="text-align:left">
          <div style="font-weight:500">Exportar mis datos</div>
          <div style="font-size:11px;color:var(--muted)">Descarga un JSON con todo tu historial</div>
        </div>
      </button>
      <button class="export-btn" onclick="importData()">
        <span style="font-size:18px">📥</span>
        <div style="text-align:left">
          <div style="font-weight:500">Importar datos</div>
          <div style="font-size:11px;color:var(--muted)">Restaura un backup anterior</div>
        </div>
      </button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
    </div>`;
}

function renderIdeas(){
  return `<div class="page-title">💡 Bandeja de Ideas</div>
    <div class="page-sub">Captura todo. Procesas una vez al día.</div>
    <div class="card">
      <textarea class="form-textarea" id="quickIdeaText" maxlength="2000" placeholder="¿Qué idea quieres capturar?"></textarea>
      <div class="cat-pills" style="margin:8px 0">${CATS.map(c=>`<button class="cat-pill" onclick="S.captureCategory='${esc(c.id)}';render()"
        style="background:${c.id===S.captureCategory?c.color+'33':'var(--surface)'};color:${c.id===S.captureCategory?c.color:'var(--muted)'};border-color:${c.id===S.captureCategory?c.color:'var(--border)'}">
        ${c.icon} ${esc(c.label)}</button>`).join('')}</div>
      <button class="btn-primary" onclick="saveQuickIdea()">Guardar idea</button>
    </div>
    ${S.ideas.length===0?`<div style="background:var(--card);border:1px dashed var(--border);border-radius:16px;padding:28px;text-align:center"><div style="font-size:34px;margin-bottom:8px">💡</div><div style="font-family:'Syne',sans-serif;font-weight:700;margin-bottom:6px">Bandeja vacía</div><div style="font-size:13px;color:var(--muted)">Cuando llegue una idea, captúrala aquí.</div></div>`
    :S.ideas.map(i=>{
      const c=cat(i.category);
      return `<div class="idea-item" style="opacity:${i.processed?.5:1};border-color:${i.processed?'var(--border)':c.color+'44'}">
        <div style="font-size:11px;color:${c.color};margin-bottom:4px">${c.icon} ${esc(c.label)}</div>
        <div style="font-size:14px;line-height:1.6;margin:4px 0 8px;text-decoration:${i.processed?'line-through':'none'};color:${i.processed?'var(--dim)':'var(--text)'};white-space:pre-wrap;word-break:break-word">${esc(i.text)}</div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-size:10px;color:var(--dim)">${esc(new Date(i.date).toLocaleDateString('es-CO',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}</div>
          <div style="display:flex;gap:6px">
            <button class="idea-btn" onclick="toggleIdea(${i.id})" style="background:${i.processed?'var(--green-soft)':'var(--accent-soft)'};color:${i.processed?'var(--green)':'var(--accent)'}">${i.processed?'↩':'✓'}</button>
            <button class="del-btn" onclick="deleteIdea(${i.id})">×</button>
          </div>
        </div>
      </div>`;
    }).join('')}`;
}

function renderRevision(){
  if(reviewDone()){
    const r=S.weekReview;
    return `<div class="page-title">🔄 Revisión Semanal</div>
      <div style="background:var(--green-soft);border:1px solid #2DD4A044;border-radius:16px;padding:20px;margin-bottom:14px;text-align:center">
        <div style="font-size:32px;margin-bottom:8px">✅</div>
        <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:16px;color:var(--green);margin-bottom:14px">Revisión completada</div>
        ${r.why?`<div style="margin-bottom:10px;text-align:left"><div style="font-size:11px;color:var(--muted);margin-bottom:4px">FRICCIÓN</div><div style="font-size:14px">${esc(r.why)}</div></div>`:''}
        ${r.focus?`<div style="text-align:left"><div style="font-size:11px;color:var(--muted);margin-bottom:4px">ENFOQUE DE ESTA SEMANA</div><div style="font-size:14px;font-style:italic">"${esc(r.focus)}"</div></div>`:''}
      </div>
      <button onclick="S.weekReview={};save().then(()=>{startReview()})" class="btn-secondary" style="width:100%">Hacer nueva revisión</button>`;
  }
  if(S.reviewStep===null||S.reviewStep===undefined){
    return `<div class="page-title">🔄 Revisión Semanal</div>
      <div class="page-sub">5 minutos para cerrar la semana.</div>
      <div class="card" style="text-align:center;padding:28px">
        <div style="font-size:40px;margin-bottom:12px">🔄</div>
        <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:18px;margin-bottom:8px">Revisión de la semana</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6">${isSunday()?'Hoy es domingo — el momento perfecto.':'Puedes hacerla cualquier día.'}</div>
        <button class="btn-primary" onclick="startReview()">Empezar →</button>
      </div>`;
  }
  const step=S.reviewStep;
  const q=REVIEW_QUESTIONS[step];
  const progress=Math.round((step/REVIEW_QUESTIONS.length)*100);
  const bH=S.habits.filter(h=>h.type==='building');
  let body='';
  if(q.type==='habit'){
    body=bH.length===0?`<button class="review-option" onclick="reviewAnswer('Ninguno')">No tengo hábitos en construcción →</button>`
      :bH.map(h=>`<button class="review-option" onclick="reviewAnswer('${esc(h.name).replace(/'/g,'')}')">${esc(h.name)}</button>`).join('')
       +`<button class="review-option" onclick="reviewAnswer('Todos bien')">Todos fueron bien ✓</button>`;
  } else if(q.type==='choice'){
    body=q.opts.map(o=>`<button class="review-option" onclick="reviewAnswer('${esc(o).replace(/'/g,'')}')">${esc(o)}</button>`).join('');
  } else if(q.type==='habit_promote'){
    body=bH.length===0?`<button class="review-option" onclick="reviewAnswer('Ninguno aún')">Ninguno aún →</button>`
      :bH.map(h=>`<button class="review-option" onclick="promoteFromReview(${h.id})">✅ ${esc(h.name)} — ya es automático</button>`).join('')
       +`<button class="review-option" onclick="reviewAnswer('Ninguno listo')">Ninguno listo aún →</button>`;
  } else if(q.type==='text'){
    body=`<textarea id="reviewTextInput" maxlength="500" class="form-textarea" placeholder="ej: Ser más consistente con el Semáforo"></textarea>
      <button class="btn-primary" style="margin-top:10px" onclick="reviewTextAnswer()">Finalizar ✓</button>`;
  }
  return `<div class="page-title">🔄 Revisión Semanal</div>
    <div style="background:var(--border);border-radius:4px;height:4px;margin-bottom:20px;overflow:hidden">
      <div style="height:100%;width:${progress}%;background:var(--accent);border-radius:4px"></div>
    </div>
    <div class="review-step">
      <div style="font-size:11px;color:var(--accent);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px">Pregunta ${step+1} de ${REVIEW_QUESTIONS.length}</div>
      <div class="review-question">${esc(q.q)}</div>
      ${body}
    </div>`;
}

function renderCoach(){
  const alerts=getFrictionAlerts();
  const cons=getConsistency30();
  const laws=[
    {num:'1',law:'Hazlo obvio',desc:"Define cuándo y dónde exactamente.",icon:'👁️',color:'var(--blue)'},
    {num:'2',law:'Hazlo atractivo',desc:'Combina lo necesario con lo placentero.',icon:'✨',color:'var(--gold)'},
    {num:'3',law:'Hazlo fácil',desc:'Regla de los 2 minutos.',icon:'🪶',color:'var(--green)'},
    {num:'4',law:'Hazlo satisfactorio',desc:'El check y el streak son tu recompensa.',icon:'🏆',color:'var(--accent)'},
  ];
  return `<div class="page-title" style="margin-bottom:14px">🧠 Coach HA</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-icon">📅</div><div class="stat-val" style="color:var(--accent)">${cons}%</div><div class="stat-label">Consistencia 30d</div></div>
      <div class="stat-card"><div class="stat-icon">🔥</div><div class="stat-val" style="color:var(--gold)">${getBestStreak()}d</div><div class="stat-label">Mejor racha</div></div>
      <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-val" style="color:var(--green)">${completedToday()}</div><div class="stat-label">Hoy completados</div></div>
      <div class="stat-card"><div class="stat-icon">⚠️</div><div class="stat-val" style="color:var(--red)">${alerts.length}</div><div class="stat-label">Con fricción</div></div>
    </div>
    ${alerts.length>0?`<div style="background:var(--red-soft);border:1px solid #FF6B6B44;border-radius:14px;padding:14px;margin-bottom:12px">
      <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:var(--red);margin-bottom:8px">⚠️ Detector de Fricción</div>
      ${alerts.map(({habit,missed})=>`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:13px">${esc(habit.name)} — <span style="color:var(--red)">${missed} días</span></span>
        <button onclick="openFriction(${habit.id})" style="background:var(--red);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer">Rediseñar</button>
      </div>`).join('')}
    </div>`:''}
    <button class="ai-btn ${S.loadingAI?'loading':''}" onclick="getAiInsight()">
      ${S.loadingAI?'Analizando tu historial…':'✨ Coach IA — análisis de 30 días'}
    </button>
    ${S.aiInsight?`<div class="ai-result">
      <div style="font-size:11px;color:var(--accent);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">🧠 Análisis personalizado</div>
      <div style="font-size:15px;line-height:1.7;font-style:italic">"${esc(S.aiInsight)}"</div>
    </div>`:''}
    <div class="section-label" style="margin-bottom:10px">Las 4 Leyes</div>
    ${laws.map(p=>`<div class="law-card"><div class="law-icon" style="background:${p.color}22">${p.icon}</div>
      <div><div style="font-family:'Syne',sans-serif;font-weight:700;font-size:14px;margin-bottom:4px">Ley ${esc(p.num)}: ${esc(p.law)}</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.6">${esc(p.desc)}</div></div>
    </div>`).join('')}`;
}

  if(e.key==='Escape'){closeCapture();closeFriction();closeRedesign()}
});

(async()=>{
  try{
    await loadAll();
    document.getElementById('splash').style.display='none';
    document.getElementById('app').style.display='flex';

      setTimeout(()=>toast('Usando almacenamiento local (modo compatibilidad)','info'),500);

  }
})();
